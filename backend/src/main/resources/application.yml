spring:
  application:
    name: url-shortener

  datasource:
    url: jdbc:postgresql://localhost:5433/url_shortener
    username: url_shortener
    password: url_shortener_dev

  flyway:
    enabled: true
    default-schema: shortener_v2
    schemas: shortener_v2
    create-schemas: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properites:
      hibernate:
        format_sql: true
        default_schema: shortener_v2
